# Required checks for every pull request. Job names are the check names that the
# main-branch ruleset requires: test, gitleaks, docker.
#
# Publishing the image to GHCR happens in deploy.yml, only after this workflow
# succeeds on main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: status_test
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d status_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/status_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # lets the action comment on the offending line
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          build-args: APP_VERSION=${{ github.sha }}
      - name: Start a throwaway database
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=status_test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U postgres -d status_test > /dev/null 2>&1 && break
            sleep 1
          done
      - name: Start with production hardening and wait for the health check
        run: |
          docker run -d --name app --network ci \
            -e DATABASE_URL=postgres://postgres@db:5432/status_test \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 256m app:ci
          status=starting
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 2
          done
          docker logs app
          echo "health: $status"
          [ "$status" = healthy ]
      - name: Health endpoint and history report the commit
        run: |
          body=$(docker exec app wget -qO- http://127.0.0.1:3000/healthz)
          echo "$body"
          echo "$body" | grep -q '"version":"${{ github.sha }}"'
          docker exec app wget -qO- http://127.0.0.1:3000/ | grep -q '${{ github.sha }}'
          test "$(docker exec db psql -U postgres -d status_test -Atc 'SELECT count(*) FROM releases')" = 1
