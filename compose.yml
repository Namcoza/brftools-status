# Production runtime declaration. On the P410 this file is copied to the app's
# directory under /srv/apps and run by the deploy script with IMAGE set to an
# immutable digest. Real values come from .env, rendered from 1Password at deploy
# time — never hard-code hostnames, addresses or secrets here.

services:
  app:
    image: ${IMAGE:-brftools-status:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    stop_grace_period: 10s

    # Resource limits are required: this host also runs the family's game servers.
    mem_limit: 256m
    cpus: 0.5

    # Hardening. Do not relax without asking.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # No published ports: the reverse proxy reaches the app over the shared network,
    # by a project-specific alias. The generic service name "app" would collide with
    # other projects on the same network.
    networks:
      edge:
        aliases:
          - brftools-status

    # Tailscale summary written every minute by a timer on the host (README, "Tailscale
    # section"). Read-only, and a directory rather than a file so that the host's atomic
    # replacement of status.json is visible inside the container.
    volumes:
      - ./tailscale:/run/tailscale-status:ro
      # Minecraft admin menu (README, "Admin menu"): requests for the host's runner are written
      # to the inbox; the runner's progress, server state and history come back read-only.
      # Docker, RCON and container names stay on the host.
      - ./mc-actions/inbox:/run/mc-actions/inbox
      - ./mc-actions/state:/run/mc-actions/state:ro

    # Persistent data: none in the container. Release history lives in the "status"
    # database on the shared PostgreSQL instance — see "Persistent data" in README.md.

networks:
  edge:
    external: true
